# =============================================================================
# fork-image —— 本 fork 自有的镜像构建流（不修改上游任何文件）
# 用途：把 main 构建为 linux/arm64 镜像并推送 GHCR，供部署机（Studio）直拉。
# 触发：push 到 main / 手动 workflow_dispatch。
# 说明：使用仓库根 Dockerfile（源码多阶段构建）；上游合并不会与本文件冲突。
# =============================================================================
name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 公共仓库可用的免费 arm64 runner（部署机为 Apple Silicon，原生 arm64 构建）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
